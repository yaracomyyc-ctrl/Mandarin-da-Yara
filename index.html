<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarim Treino</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e3e1da;--acc:#c0392b;--acc-ink:#fff;--ok:#1e8a4c;--bad:#c0392b;--warn:#b7791f;
--t1:#d6336c;--t2:#e8590c;--t3:#2b8a3e;--t4:#1c7ed6;--t5:#868e96}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--ink:#f1efe8;--mute:#9a9890;--line:#34332f;--acc:#e5604f;--ok:#4cc57e;--bad:#ff7b6b;--warn:#e0a84b;
--t1:#f783ac;--t2:#ffa94d;--t3:#69db7c;--t4:#74c0fc;--t5:#adb5bd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:16px;margin:24px 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
.nav{display:flex;gap:8px;margin:12px 0 16px}
.nav button{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
button.sm{padding:5px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
.deck{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.deck:first-child{border-top:0}
.deck label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer}
.deck .n{color:var(--mute);font-size:13px;text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;margin-left:4px}
.pill.d{background:var(--acc);color:var(--acc-ink)}.pill.n{background:var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row label{display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.hint{color:var(--mute);font-size:13px}
/* estudo */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
.study{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px 16px;text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:border-color .15s}
.study.ok{border-color:var(--ok)}.study.bad{border-color:var(--bad)}
.hanzi{font-size:clamp(56px,16vw,110px);line-height:1.15;font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;word-break:keep-all}
.hanzi.long{font-size:clamp(34px,9vw,60px)}
.pinyin{font-size:26px;min-height:34px}
.trans{font-size:20px;color:var(--mute);min-height:30px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
.msg{min-height:26px;font-weight:600}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
.heard{color:var(--mute);font-size:14px;min-height:20px}
.mic{width:84px;height:84px;border-radius:50%;font-size:34px;padding:0;background:var(--acc);border-color:var(--acc);color:#fff}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}100%{box-shadow:0 0 0 22px rgba(192,57,43,0)}}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:42px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.hide{display:none!important}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:5px 6px;border-top:1px solid var(--line);text-align:left}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mandarim Treino</h1>
  <p class="sub">Fale a palavra, o app confere. Erros voltam; acertos voltam em intervalos cada vez maiores.</p>
  <div class="nav" id="nav">
    <button data-v="home" class="on">Treinar</button>
    <button data-v="lib">Vocabulários e importar</button>
  </div>
  <div id="home"></div>
  <div id="lib" class="hide"></div>
  <div id="study" class="hide"></div>
</div>
<div id="toast" class="toast hide"></div>

<script src="decks.js"></script>
<script src="decks2.js"></script>
<script src="decks3.js"></script>
<script>
/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const HAN=/[㐀-鿿豈-﫿]/;
const hanOnly=s=>(s||'').replace(/[^㐀-鿿豈-﫿]/g,'');
const today=()=>new Date().toLocaleDateString('sv');
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hide'),2600)}

/* ---------- dados ---------- */
const KEY='mandarim_treino_v1';
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.cards)db={decks:[],cards:[],nid:1,loaded:[],log:{},set:{size:30,mode:'voz',auto:true,mult:1,sel:[]}};
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(flush,400)}
function flush(){clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Não consegui salvar (armazenamento cheio ou bloqueado). Exporte um backup.')}}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

function addCards(deckId,items){
  const have=new Set(db.cards.filter(c=>c.d===deckId).map(c=>c.h));let n=0;
  for(const it of items){if(!it.h||have.has(it.h))continue;have.add(it.h);
    db.cards.push({i:db.nid++,d:deckId,h:it.h,p:it.p||'',t:it.t||'',s:it.s??-1,u:it.u??0,l:it.l??0});n++}
  return n;
}
function loadBuiltin(){
  for(const b of window.BUILTIN||[]){
    const ver=b.v||1,vers=db.ver||(db.ver={});
    if(db.loaded.includes(b.id)&&(vers[b.id]||1)>=ver)continue;  // lista já carregada nesta versão
    if(!db.loaded.includes(b.id))db.loaded.push(b.id);
    vers[b.id]=ver;
    const ex=db.decks.find(d=>d.id===b.id);
    if(ex)ex.name=b.name;else db.decks.push({id:b.id,name:b.name,builtin:true});
    const items=b.raw.trim().split('\n').map(l=>{const [h,p,...t]=l.split('|');return{h:h.trim(),p:(p||'').trim(),t:t.join('|').trim()}});
    if(ex){const keep=new Set(items.map(i=>i.h));db.cards=db.cards.filter(c=>c.d!==b.id||c.s>=0||keep.has(c.h))} // atualização: remove só cartões nunca estudados que saíram da lista
    addCards(b.id,items);
    if(!db.set.sel.includes(b.id))db.set.sel.push(b.id);
  }
  save();
}
loadBuiltin();

/* ---------- pinyin (opcional, CDN) ---------- */
let PY=null;
(function(){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js';
  s.onload=()=>{PY=window.pinyinPro||null;if(S&&S.cur)renderCard()};s.onerror=()=>{};document.head.appendChild(s)})();
const pyOf=h=>{try{return PY?PY.pinyin(h,{toneType:'symbol',type:'array'}).join(''):''}catch(e){return ''}};
const pyShow=c=>c.p||(PY?(function(){try{return PY.pinyin(c.h,{toneType:'symbol'})}catch(e){return ''}})():'');
const TONE={};'āēīōūǖ'.split('').forEach(c=>TONE[c]=1);'áéíóúǘ'.split('').forEach(c=>TONE[c]=2);'ǎěǐǒǔǚ'.split('').forEach(c=>TONE[c]=3);'àèìòùǜ'.split('').forEach(c=>TONE[c]=4);
function colorPinyin(p){return esc(p.normalize('NFC')).replace(/[āēīōūǖáéíóúǘǎěǐǒǔǚàèìòùǜ]/g,m=>`<span class="t${TONE[m]}">${m}</span>`)}

/* ---------- fala ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function speak(text){
  try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}

/* ---------- SRS ---------- */
const STEPS=[10,1440,4320,10080,20160,43200,86400,172800]; // minutos: 10min,1d,3d,7d,14d,30d,60d,120d
const stepMs=s=>STEPS[s]*60000*(db.set.mult||1);
function logAnswer(ok){const k=today();const l=db.log[k]||(db.log[k]={n:0,ok:0});l.n++;if(ok)l.ok++}
function promote(c){c.s=c.s<0?1:Math.min(c.s+1,STEPS.length-1);c.u=Date.now()+stepMs(c.s);logAnswer(true);save()}
function demote(c){c.s=0;c.l++;c.u=Date.now()+stepMs(0);logAnswer(false);save()}

/* ---------- navegação ---------- */
function view(v){
  for(const id of ['home','lib','study'])$('#'+id).classList.toggle('hide',id!==v);
  $('#nav').classList.toggle('hide',v==='study');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='home')renderHome();if(v==='lib')renderLib();
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)view(b.dataset.v)};

/* ---------- home ---------- */
function deckCounts(){
  const now=Date.now(),m={};
  for(const d of db.decks)m[d.id]={tot:0,nw:0,due:0,mast:0};
  for(const c of db.cards){const x=m[c.d];if(!x)continue;x.tot++;if(c.s<0)x.nw++;else{if(c.u<=now)x.due++;if(c.s>=4)x.mast++}}
  return m;
}
function streak(){let n=0;const d=new Date();if(!(db.log[d.toLocaleDateString('sv')]?.n))d.setDate(d.getDate()-1);
  while(db.log[d.toLocaleDateString('sv')]?.n){n++;d.setDate(d.getDate()-1)}return n}
function renderHome(){
  const m=deckCounts(),sel=new Set(db.set.sel),t=db.log[today()]||{n:0,ok:0};
  let due=0,nw=0;for(const d of db.decks){due+=m[d.id].due;nw+=m[d.id].nw}
  $('#home').innerHTML=`
  <div class="stats">
    <div class="stat"><b>${due}</b><span>para revisar</span></div>
    <div class="stat"><b>${nw}</b><span>ainda não testadas</span></div>
    <div class="stat"><b>${t.n?Math.round(100*t.ok/t.n):0}%</b><span>acertos hoje (${t.n})</span></div>
    <div class="stat"><b>${streak()}</b><span>dias seguidos</span></div>
  </div>
  <div class="card"><b>Listas para treinar</b>
    ${db.decks.map(d=>{const x=m[d.id];return`<div class="deck"><label><input type="checkbox" data-deck="${esc(d.id)}" ${sel.has(d.id)?'checked':''}>
      <span>${esc(d.name)}</span></label>
      <span class="n">${x.tot} palavras${x.due?`<span class="pill d">${x.due} rev.</span>`:''}${x.nw?`<span class="pill n">${x.nw} novas</span>`:''}</span></div>`}).join('')||'<p class="hint">Nenhuma lista. Importe na aba ao lado.</p>'}
  </div>
  <div class="card"><b>Sessão</b>
    <div class="row">
      <label>Modo
        <select id="s-mode"><option value="voz">Falar (microfone)</option><option value="manual">Revelar e autoavaliar</option></select></label>
      <label>Cartões
        <select id="s-size">${[10,20,30,50,100,0].map(n=>`<option value="${n}">${n||'todos'}</option>`).join('')}</select></label>
    </div>
    <div class="row">
      <label>Frequência de revisão
        <select id="s-mult"><option value="0.5">Intensa (intervalos ×0,5)</option><option value="1">Normal</option><option value="1.5">Espaçada (×1,5)</option></select></label>
      <label><input type="checkbox" id="s-auto"> Ouvir automaticamente</label>
    </div>
    <p class="hint">Cada acerto empurra a palavra para mais longe: 1 dia, 3, 7, 14, 30, 60, 120 dias. Errou, volta para 10 minutos e reaparece na própria sessão.</p>
    <button class="pri" id="go">Começar</button>
  </div>`;
  $('#s-mode').value=db.set.mode;$('#s-size').value=db.set.size;$('#s-mult').value=db.set.mult;$('#s-auto').checked=db.set.auto;
  $('#home').onchange=e=>{
    if(e.target.dataset.deck){const s=new Set(db.set.sel);e.target.checked?s.add(e.target.dataset.deck):s.delete(e.target.dataset.deck);db.set.sel=[...s]}
    db.set.mode=$('#s-mode').value;db.set.size=+$('#s-size').value;db.set.mult=+$('#s-mult').value;db.set.auto=$('#s-auto').checked;save()};
  $('#go').onclick=startSession;
}

/* ---------- sessão de estudo ---------- */
let S=null,rec=null;
function startSession(){
  const sel=new Set(db.set.sel),now=Date.now(),due=[],nw=[];
  for(const c of db.cards){if(!sel.has(c.d))continue;if(c.s<0)nw.push(c);else if(c.u<=now)due.push(c)}
  shuffle(due);shuffle(nw);
  const size=db.set.size||Infinity;
  let pick=due.slice(0,size);if(pick.length<size)pick=pick.concat(nw.slice(0,size-pick.length));
  if(!pick.length){toast(sel.size?'Nada para revisar agora nessas listas.':'Marque ao menos uma lista.');return}
  shuffle(pick);
  S={q:pick.slice(),total:pick.length,done:0,ok:0,tried:new Set(),miss:[],phase:'ask',cur:null,mode:(db.set.mode==='voz'&&SR)?'voz':'manual',listening:false};
  if(db.set.mode==='voz'&&!SR)toast('Seu navegador não tem reconhecimento de voz. Use Chrome ou Edge. Modo manual ativado.');
  view('study');nextCard();
}
function stopRec(){try{rec&&rec.abort()}catch(e){}rec=null;if(S)S.listening=false}
function nextCard(){
  stopRec();
  if(!S.q.length)return endSession();
  S.cur=S.q[0];S.phase='ask';S.heard='';S.msg='';S.msgCls='';renderCard();
  if(S.mode==='voz'&&db.set.auto)setTimeout(()=>{if(S&&S.phase==='ask')listen()},350);
}
function renderCard(){
  if(!S||!S.cur)return;
  const c=S.cur,ask=S.phase==='ask',res=S.phase==='ok'||S.phase==='bad';
  const showAns=S.phase!=='ask'||S.revealed;
  $('#study').innerHTML=`
  <div class="top"><button class="sm" id="quit">← Sair</button><div class="bar"><i style="width:${100*S.done/S.total}%"></i></div><span class="hint">${S.done}/${S.total}</span></div>
  <div class="study ${S.phase==='ok'?'ok':S.phase==='bad'?'bad':''}">
    <div class="hanzi ${c.h.length>6?'long':''}">${esc(c.h)}</div>
    <div class="pinyin">${showAns?colorPinyin(pyShow(c)):''}</div>
    <div class="trans">${showAns?esc(c.t):''}</div>
    <div class="msg ${S.msgCls}">${esc(S.msg)}</div>
    <div class="heard">${S.heard?'Ouvi: '+esc(S.heard):''}</div>
    <div class="ctl">
      ${ask&&S.mode==='voz'?`<button class="mic ${S.listening?'live':''}" id="mic" title="Falar (Espaço)">🎤</button>`:''}
      ${ask&&S.mode==='manual'&&!S.revealed?`<button class="pri" id="reveal">Mostrar resposta (Espaço)</button>`:''}
      ${ask&&S.mode==='manual'&&S.revealed?`<button id="know" class="pri">Sabia</button><button id="dontknow">Não sabia</button>`:''}
      ${ask&&S.mode==='voz'?`<button id="idk">Não sei</button>`:''}
      ${S.phase==='ok'?`<button class="pri" id="cont">Próximo (Espaço)</button>`:''}
      ${S.phase==='bad'?`<button class="pri" id="cont">Continuar (Espaço)</button><button id="override">Acertei mesmo</button>`:''}
      <button id="hear" title="Ouvir a pronúncia">🔊</button>
    </div>
  </div>`;
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  on('quit',()=>{stopRec();flush();S=null;view('home')});
  on('mic',()=>S.listening?stopRec()||renderCard():listen());
  on('hear',()=>speak(c.h));
  on('idk',()=>judgeWrong('Sem resposta'));
  on('reveal',()=>{S.revealed=true;speak(c.h);renderCard()});
  on('know',()=>{S.revealed=false;judgeRight()});
  on('dontknow',()=>{S.revealed=false;judgeWrong('')});
  on('cont',advance);
  on('override',override);
}
function listen(){
  if(!SR||!S||S.phase!=='ask'||S.listening)return;
  const r=new SR();r.lang='zh-CN';r.maxAlternatives=6;r.interimResults=false;r.continuous=false;
  let got=false,err='';const mine=S.cur;
  r.onresult=e=>{got=true;judge([...e.results[0]].map(a=>a.transcript))};
  r.onerror=e=>{err=e.error};
  r.onend=()=>{if(!S||S.cur!==mine||rec!==r)return;rec=null;S.listening=false;
    if(!got&&S.phase==='ask'){
      if(err==='not-allowed'||err==='service-not-allowed'){S.mode='manual';S.msg='Microfone bloqueado. Libere a permissão do site ou use o modo manual.';S.msgCls='warn'}
      else if(err==='network'){S.msg='O reconhecimento de voz precisa de internet.';S.msgCls='warn'}
      else{S.msg='Não ouvi nada. Toque no microfone e fale de novo.';S.msgCls='warn'}
      renderCard()}};
  try{rec=r;S.listening=true;S.msg='Ouvindo…';S.msgCls='';S.heard='';r.start();renderCard()}catch(e){S.listening=false;rec=null}
}
function judge(alts){
  if(!S||S.phase!=='ask')return;
  const c=S.cur,target=hanOnly(c.h);S.listening=false;rec=null;S.heard=alts[0]||'';
  let ok=!!target&&alts.some(a=>hanOnly(a)===target);
  if(!ok&&PY&&target){const tp=pyOf(target);ok=!!tp&&alts.some(a=>{const h=hanOnly(a);return h&&pyOf(h)===tp})}
  ok?judgeRight():judgeWrong('');
}
function judgeRight(){
  const c=S.cur;stopRec();
  if(!S.tried.has(c.i)){promote(c);S.ok++}
  S.phase='ok';S.msg='✓ Correto';S.msgCls='ok';renderCard();
  setTimeout(()=>{if(S&&S.cur===c&&S.phase==='ok')advance()},S.mode==='voz'?1400:300);
}
function judgeWrong(note){
  const c=S.cur;stopRec();
  if(!S.tried.has(c.i)){(S.prev||(S.prev={}))[c.i]={s:c.s,u:c.u,l:c.l};demote(c);S.miss.push(c)}
  S.tried.add(c.i);
  S.phase='bad';S.msg=note==='Sem resposta'?'Sem problema, veja a resposta:':'✗ Não confere';S.msgCls='bad';renderCard();speak(c.h);
}
function override(){ // reconhecimento errou, mas eu falei certo
  const c=S.cur;
  if(S.miss.includes(c)){ // desfaz o rebaixamento
    S.miss=S.miss.filter(x=>x!==c);Object.assign(c,S.prev[c.i]);S.tried.delete(c.i);
    const k=today();if(db.log[k]){db.log[k].n=Math.max(0,db.log[k].n-1)}
  }
  S.phase='ask';judgeRight();
}
function advance(){
  if(!S)return;const c=S.q.shift();
  if(S.phase==='bad'){S.q.splice(Math.min(3,S.q.length),0,c)}   // volta embaralhado entre os próximos
  else{S.done++}
  nextCard();
}
function endSession(){
  const s=S;flush();stopRec();
  const acc=s.total?Math.round(100*s.ok/s.total):0;
  $('#study').innerHTML=`<div class="card" style="text-align:center"><h2>Sessão concluída</h2>
    <p style="font-size:28px;margin:6px 0"><b>${acc}%</b> de acerto na primeira tentativa</p>
    <p class="hint">${s.ok} de ${s.total} certas de primeira</p>
    ${s.miss.length?`<table><tr><th>Para reforçar</th><th></th><th></th></tr>${s.miss.map(c=>`<tr><td style="font-size:20px">${esc(c.h)}</td><td>${colorPinyin(pyShow(c))}</td><td>${esc(c.t)}</td></tr>`).join('')}</table>`:'<p>Nenhum erro. 🎉</p>'}
    <div class="row" style="justify-content:center"><button class="pri" id="again">Nova sessão</button><button id="home2">Início</button></div></div>`;
  $('#again').onclick=startSession;$('#home2').onclick=()=>{S=null;view('home')};
  S=null;
}
addEventListener('keydown',e=>{
  if(!S||$('#study').classList.contains('hide')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();
    if(S.phase==='ok'||S.phase==='bad')advance();
    else if(S.mode==='voz')S.listening?0:listen();
    else if(!S.revealed){S.revealed=true;speak(S.cur.h);renderCard()}}
});

/* ---------- biblioteca / importar ---------- */
function parseLines(text){
  const out=[];
  for(let line of text.split(/\r?\n/)){
    line=line.trim();if(!line)continue;
    const sep=line.includes('\t')?'\t':line.includes(';')?';':line.includes('|')?'|':',';
    const parts=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));
    const h=parts[0];if(!HAN.test(h))continue; // ignora cabeçalhos/linhas sem hanzi
    let p='',t='';
    if(parts.length>=3){p=parts[1];t=parts.slice(2).join(sep===','?', ':sep)}
    else if(parts.length===2){const x=parts[1];if(/^[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùüǖǘǚǜ\s'·]+$/.test(x)&&/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(x))p=x;else t=x}
    out.push({h,p,t});
  }
  return out;
}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:type+';charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function renderLib(){
  const m=deckCounts();
  $('#lib').innerHTML=`
  <div class="card"><b>Importar lista</b>
    <p class="hint">Uma palavra por linha: <code>汉字 ; pinyin ; tradução</code>. Separador pode ser tab, ponto e vírgula, barra vertical ou vírgula. Pinyin e tradução são opcionais; se faltar o pinyin, ele é gerado automaticamente quando há internet.</p>
    <div class="row"><label>Lista:
      <select id="i-deck"><option value="">➕ Nova lista…</option>${db.decks.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}</select></label>
      <input type="text" id="i-name" placeholder="Nome da nova lista"></div>
    <textarea id="i-text" placeholder="你好;nǐ hǎo;olá&#10;谢谢;xièxie;obrigado"></textarea>
    <div class="row"><input type="file" id="i-file" accept=".txt,.csv,.tsv"><button class="pri" id="i-go">Importar</button></div>
  </div>
  <div class="card"><b>Minhas listas</b>
    ${db.decks.map(d=>`<div class="deck"><span style="flex:1">${esc(d.name)} <span class="hint">· ${m[d.id].tot} palavras</span></span>
      <button class="sm" data-exp="${esc(d.id)}">Exportar CSV</button><button class="sm" data-del="${esc(d.id)}">Apagar</button></div>`).join('')||'<p class="hint">Vazio.</p>'}
    <div class="row"><button class="sm" id="restore-std">Restaurar listas padrão</button></div>
  </div>
  <div class="card"><b>Backup do progresso</b>
    <p class="hint">Os dados ficam só neste navegador. Exporte um backup de vez em quando.</p>
    <div class="row"><button id="bk-exp">Exportar backup (JSON)</button><label class="hint">Restaurar: <input type="file" id="bk-imp" accept=".json"></label></div>
  </div>`;
  $('#i-file').onchange=async e=>{const f=e.target.files[0];if(f){$('#i-text').value=await f.text();if(!$('#i-name').value)$('#i-name').value=f.name.replace(/\.\w+$/,'')}};
  $('#i-go').onclick=()=>{
    const items=parseLines($('#i-text').value);if(!items.length){toast('Nenhuma linha com hanzi encontrada.');return}
    let id=$('#i-deck').value;
    if(!id){const name=$('#i-name').value.trim();if(!name){toast('Dê um nome à nova lista.');return}
      id='u'+Date.now().toString(36);db.decks.push({id,name});db.set.sel.push(id)}
    const n=addCards(id,items);save();toast(`${n} palavras adicionadas${n<items.length?` (${items.length-n} repetidas ignoradas)`:''}.`);renderLib();
    if(PY)fillPinyin(id);
  };
  $('#lib').onclick=e=>{
    const x=e.target.closest('button');if(!x)return;
    if(x.dataset.del){const d=db.decks.find(d=>d.id===x.dataset.del);if(confirm(`Apagar "${d.name}" e todo o progresso dela?`)){
      db.decks=db.decks.filter(k=>k.id!==d.id);db.cards=db.cards.filter(c=>c.d!==d.id);db.set.sel=db.set.sel.filter(s=>s!==d.id);save();renderLib()}}
    if(x.dataset.exp){const d=db.decks.find(d=>d.id===x.dataset.exp);download(d.name+'.csv',db.cards.filter(c=>c.d===d.id).map(c=>[c.h,c.p,c.t].join(';')).join('\n'),'text/csv')}
    if(x.id==='restore-std'){db.loaded=[];loadBuiltin();toast('Listas padrão restauradas (as já existentes não duplicam).');renderLib()}
    if(x.id==='bk-exp')download('mandarim-backup-'+today()+'.json',JSON.stringify(db),'application/json');
  };
  $('#bk-imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!d.cards||!d.decks)throw 0;if(confirm('Substituir tudo pelo backup?')){db=d;flush();location.reload()}}catch(x){toast('Arquivo de backup inválido.')}};
}
function fillPinyin(deckId){for(const c of db.cards)if(c.d===deckId&&!c.p){c.p=pyShow(c)}save()}

/* ---------- start ---------- */
view('home');
</script>
